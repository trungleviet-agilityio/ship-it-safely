# Revs are pinned to full commit SHAs; the release tag is in the `frozen` comment (NFR-3).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 443ffdff1cc1663b701ae73e7459029fe883455a # frozen: v1.109.3
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
