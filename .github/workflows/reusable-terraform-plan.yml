# Pull request plan of one environment (ADR 0008, P6): plan with the read-only plan role, negative tests of that role,
# and an account-free sticky comment. Called once per environment by a `plan-<env>` job of terraform-iac.yml.
# Only `workflow_call` here (the trigger policy refuses it in any other file). The caller passes every secret by name,
# never `secrets: inherit`. The plan role trusts the pull_request subject only and pins no workflow file, so the
# trust does not name this file and it must stay out of the bootstrap `workflow_files`.
# No `environment:` on any job: it would change the OIDC subject the plan role trusts (ADR 0003).
# Workflow-level `env` of the caller is not propagated, so ENV is set again below from the input.
name: reusable-terraform-plan

on:
  workflow_call:
    inputs:
      env:
        description: Environment to plan (a directory under infra/terraform/envs)
        type: string
        required: true
    secrets:
      AWS_ACCOUNT_ID:
        description: Account ID of the environment
        required: true
      AWS_PLAN_ROLE_ARN:
        description: ARN of the read-only plan role
        required: true
      ALB_INGRESS_CIDRS:
        description: Optional JSON list of CIDRs allowed to reach the ALB
        required: false

permissions: {}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  # No HashiCorp version check call: checkpoint-api.hashicorp.com is not in the allowlists (ADR 0007 S44).
  CHECKPOINT_DISABLE: "1"
  # The single key: the scripts and the steps derive the environment root, the role names and the titles from it.
  ENV: ${{ inputs.env }}

jobs:
  plan:
    name: plan (read-only role)
    # Fork and Dependabot PRs get no ID token or secrets, so skip them instead of failing.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for the role assumed by configure-aws-credentials
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            registry.terraform.io:443
            sts.${{ vars.AWS_REGION }}.amazonaws.com:443
            sis-${{ env.ENV }}-tfstate-${{ secrets.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}-an.s3.${{ vars.AWS_REGION }}.amazonaws.com:443
            ec2.${{ vars.AWS_REGION }}.amazonaws.com:443
            elasticloadbalancing.${{ vars.AWS_REGION }}.amazonaws.com:443
            ecs.${{ vars.AWS_REGION }}.amazonaws.com:443
            api.ecr.${{ vars.AWS_REGION }}.amazonaws.com:443
            logs.${{ vars.AWS_REGION }}.amazonaws.com:443
            secretsmanager.${{ vars.AWS_REGION }}.amazonaws.com:443
            iam.amazonaws.com:443

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validates the name (2 to 8 lowercase letters and digits) and that the root exists, before any credential is used.
      - name: Select the environment root
        run: echo "TF_DIR=$(scripts/names.sh env-root)" >> "$GITHUB_ENV"

      - name: Install Terraform and tflint (checksum verified)
        run: scripts/ci/install-tools.sh "$RUNNER_TEMP/tools"

      - name: Check configuration
        env:
          ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: scripts/aws/check-config.sh "sis-${ENV}-gha-plan"

      - name: Assume the plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          retry-max-attempts: 3

      # tf/init.sh derives the state bucket name (ADR 0002, B8), so there is no bucket secret.
      - name: Terraform init
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: scripts/tf/init.sh

      # Optional secret: a JSON list of CIDRs allowed to reach the ALB. Unset means 0.0.0.0/0 (ADR 0007 S10).
      # Each element is masked before Terraform can print it.
      - name: Mask the ALB ingress CIDRs
        env:
          CIDRS: ${{ secrets.ALB_INGRESS_CIDRS }}
        run: scripts/tf/mask-cidrs.sh

      - name: Terraform plan
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_alb_ingress_cidrs_json: ${{ secrets.ALB_INGRESS_CIDRS }}
        run: terraform -chdir="$TF_DIR" plan -lock-timeout=5m -no-color -out=tfplan

      # Counts and one row per changed address; fails if a 12-digit run shows up (the repo is public).
      - name: Summarize the plan
        id: summary
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          summary="$(terraform -chdir="$TF_DIR" show -json tfplan | scripts/tf/plan-summary.sh | scripts/aws/assert-no-account-id.sh)"
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "summary<<${delimiter}"
            echo "$summary"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # Plan files hold every value and artifacts on a public repo are downloadable: nothing is uploaded.
      - name: Remove the plan file
        if: always()
        run: rm -f "$TF_DIR/tfplan"

  plan-role-guardrails:
    name: plan role guardrails
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No write token: this job only talks to AWS with the plan role. The checkout is for the config check script.
    permissions:
      contents: read
      id-token: write # OIDC token for the role assumed by configure-aws-credentials
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            sts.${{ vars.AWS_REGION }}.amazonaws.com:443
            secretsmanager.${{ vars.AWS_REGION }}.amazonaws.com:443
            ec2.${{ vars.AWS_REGION }}.amazonaws.com:443

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check configuration
        env:
          ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: scripts/aws/check-config.sh "sis-${ENV}-gha-plan"

      - name: Assume the plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-guard-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          retry-max-attempts: 3

      # Only reads and dry runs (scripts/tf/plan-role-guardrails.sh): nothing that writes for real is tried.
      - name: Plan role is denied what it must not do (N2, N3)
        run: scripts/tf/plan-role-guardrails.sh

  comment:
    name: sticky plan comment
    needs: plan
    # Runs after a failed plan too, so the PR shows the failure. Skipped when the plan was skipped (fork, Dependabot).
    if: >-
      always()
      && needs.plan.result != 'skipped'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job with a write token: no AWS credentials, and a checkout that holds scripts/ only (the shared
    # account-ID check), without persisting the token.
    permissions:
      contents: read
      pull-requests: write # create or update the sticky plan comment
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check out the helper scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit, not the PR head: this job holds a write token, so it must run only scripts that were
          # already reviewed and merged. With the head, a PR could change scripts/ and run its own code here.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: Post or update the plan comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SUMMARY: ${{ needs.plan.outputs.summary }}
        run: |
          set -euo pipefail
          marker="<!-- terraform-iac:plan:${ENV} -->"

          # The summary was checked in the plan job; check again before it reaches a public comment.
          printf '%s\n' "$SUMMARY" | scripts/aws/assert-no-account-id.sh >/dev/null
          if [[ -z "$SUMMARY" ]]; then
            SUMMARY="No plan summary was produced. Open the run log."
          fi

          body="$(printf '%s\n\n%s\n\nPlan job result: %s. Commit: %s. [Run log](%s)\n' \
            "$marker" "$SUMMARY" "$PLAN_RESULT" "$HEAD_SHA" "$RUN_URL")"

          # Only a comment written by this workflow's bot is updated, never one that merely copies the marker.
          existing="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" \
            | head -n1)"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$body" >/dev/null
            echo "Updated plan comment"
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
            echo "Posted plan comment"
          fi
